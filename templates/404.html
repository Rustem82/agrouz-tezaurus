{% extends "base.html" %}

{% block title %}Sahifa topilmadi{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-content">
        <h1>404</h1>
        <h2>Sahifa topilmadi</h2>
        <p>Kechirasiz, so'ralgan sahifa mavjud emas yoki ko'chirilgan.</p>
        <a href="{{ url_for('index') }}" class="error-btn">Bosh sahifaga qaytish</a>
    </div>
</div>

<style>
.error-page {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.error-content h1 {
    font-size: 8rem;
    color: #667eea;
    margin-bottom: 1rem;
    animation: bounce 2s infinite;
}

.error-content h2 {
    font-size: 2rem;
    color: #333;
    margin-bottom: 1rem;
}

.error-content p {
    color: #666;
    margin-bottom: 2rem;
}

.error-btn {
    display: inline-block;
    padding: 1rem 2rem;
    background: #667eea;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    transition: background 0.3s;
}

.error-btn:hover {
    background: #5a67d8;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
    }
    40% {
        transform: translateY(-30px);
    }
    60% {
        transform: translateY(-15px);
    }
}
</style>
{% endblock %}
